<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Livescore – Poänglogg</title>
<meta name="description" content="Följ matchen live – Askim Badminton Club">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#D7192B; --bg:#F3F3F3; --surface:#FFFFFF; --ink:#000000; --muted:#5E5E5E; --rule:#D9D9D9;
  --own:#D7192B; --win:#000000; --win-soft:#E9E9E9;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --red:#FF3344; --bg:#0B0B0B; --surface:#181818; --ink:#F5F5F5; --muted:#A3A3A3; --rule:#2F2F2F;
    --own:#FF3344; --win:#FFFFFF; --win-soft:#262626; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --red:#FF3344; --bg:#0B0B0B; --surface:#181818; --ink:#F5F5F5; --muted:#A3A3A3; --rule:#2F2F2F;
  --own:#FF3344; --win:#FFFFFF; --win-soft:#262626; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:#000}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.live{max-width:560px;margin:0 auto;padding:0 16px 40px}
.head{background:#000;color:#fff;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 16px;border-bottom:5px solid var(--red);text-align:center}
.logo{display:block;height:46px;width:auto;margin:2px auto 8px;filter:invert(1)}
.badge{display:inline-block;background:var(--red);color:#fff;font-weight:600;font-size:13px;padding:2px 12px;border-radius:999px}
.badge.off{background:#4A4A4A}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:6px;margin-top:12px}
.p{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;min-width:0}
.p span.n{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.init{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#2A2A2A;font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:700}
.init.me{box-shadow:0 0 0 3px var(--red)}
.init.op{box-shadow:0 0 0 3px #555}
.big{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;font-size:76px;line-height:.95;font-variant-numeric:tabular-nums}
.dash{font-family:"Barlow Condensed",sans-serif;font-size:44px;opacity:.5;padding-bottom:36px}
.srv{display:inline-block;min-height:18px;font-size:12px;font-weight:600;line-height:18px;visibility:hidden}
.srv.on{visibility:visible;background:var(--red);color:#fff;border-radius:999px;padding:0 10px}
.games{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:14px}
.games span{font-variant-numeric:tabular-nums;opacity:.85}
.games span.cur{opacity:1;font-weight:600;border-bottom:2px solid #fff}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin-top:12px;min-height:12px}
.dots i{width:11px;height:11px;border-radius:50%;background:#fff}
.dots i.l{background:var(--red)}
.meta{text-align:center;color:var(--muted);font-size:15px;margin:10px 0}
h2{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;font-size:22px;margin:18px 0 8px}
.legend{display:flex;justify-content:center;gap:14px;font-size:14px;color:var(--muted);margin:2px 0 6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.flowset{background:var(--surface);border:1.5px solid var(--rule);border-radius:10px;padding:8px 8px 4px;margin-bottom:8px}
.flowhead{display:flex;justify-content:space-between;font-size:15px;padding:0 4px}
.flowhead span{font-variant-numeric:tabular-nums;color:var(--muted)}
.flowset svg{width:100%;height:auto;display:block}
.ax{font-size:10px;fill:var(--muted);font-family:Barlow,sans-serif}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--rule);font-size:15px}
.list small{color:var(--muted)}
.sc{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.join{background:var(--surface);border:1.5px solid var(--rule);border-radius:12px;padding:16px;margin-top:18px}
.join label{display:block;color:var(--muted);font-size:14px;margin-bottom:6px}
.join .row{display:flex;gap:8px}
.join input{flex:1;min-width:0;padding:11px;border-radius:8px;border:1.5px solid var(--rule);background:var(--bg);text-transform:uppercase;letter-spacing:2px;font-family:ui-monospace,Menlo,monospace}
.join button{border:0;border-radius:8px;padding:11px 16px;background:var(--red);color:#fff;font-weight:600;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>
<main class="live">
  <header class="head">
    <img class="logo" src="logo.png" alt="Askim Badminton Club">
    <div><span class="badge off" id="badge">Livescore</span></div>
    <div class="vs">
      <div class="p"><span class="init me" id="meInit">?</span><span class="n" id="me">–</span><b class="big" id="mePts">0</b><span class="srv" id="meSrv">Servar</span></div>
      <div class="dash">–</div>
      <div class="p"><span class="init op" id="opInit">?</span><span class="n" id="op">–</span><b class="big" id="opPts">0</b><span class="srv" id="opSrv">Servar</span></div>
    </div>
    <div class="games" id="games"></div>
    <div class="dots" id="dots" aria-label="Senaste poängen"></div>
  </header>

  <p class="meta" id="meta" aria-live="polite">Laddar …</p>

  <form class="join hidden" id="join">
    <label for="code">Skriv in koden du fått</label>
    <div class="row">
      <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="K7M2QX" maxlength="12">
      <button type="submit">Följ</button>
    </div>
  </form>

  <div id="flow"></div>
  <section id="matchesSec" class="hidden">
    <h2>Dagens matcher</h2>
    <ul class="list" id="list"></ul>
  </section>
  <p class="meta" id="updated"></p>
</main>

<script src="config.js"></script>
<script>
const CFG = window.POANGLOGG || {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const gameDone = (g, to) => { const hi = Math.max(g.me, g.opp), d = Math.abs(g.me - g.opp), cap = to === 15 ? 21 : 30; return (hi >= to && d >= 2) || hi === cap; };
const fmtTime = d => d.toLocaleTimeString("sv-SE", {hour: "2-digit", minute: "2-digit"});

let code = norm(new URLSearchParams(location.search).get("kod"));
let lastDoc = null, timer = null;

function showJoin(msg){
  $("join").classList.remove("hidden");
  $("meta").textContent = msg;
  $("code").value = code;
  $("code").focus();
}
$("join").addEventListener("submit", e => {
  e.preventDefault();
  const c = norm($("code").value);
  if (c.length < 4) return;
  code = c;
  history.replaceState(null, "", "?kod=" + encodeURIComponent(c));
  $("join").classList.add("hidden");
  $("meta").textContent = "Hämtar livescore …";
  start();
});

async function fetchDoc(){
  const url = `https://api.apple-cloudkit.com/database/1/${encodeURIComponent(CFG.container)}/${CFG.environment || "production"}/public/records/lookup?ckAPIToken=${encodeURIComponent(CFG.token)}`;
  const res = await fetch(url, {method: "POST", headers: {"Content-Type": "text/plain"}, body: JSON.stringify({records: [{recordName: code}]})});
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  const rec = (data.records || [])[0];
  if (!rec || rec.serverErrorCode) { if (rec && rec.serverErrorCode === "NOT_FOUND") return null; throw new Error(rec ? rec.serverErrorCode : "no record"); }
  const payload = rec.fields && rec.fields.payload && rec.fields.payload.value;
  if (!payload) return null;
  const doc = JSON.parse(payload);
  // Apples JSONEncoder sparar datum som sekunder sedan 2001-01-01.
  doc.updatedDate = typeof doc.updated === "number" ? new Date((doc.updated + 978307200) * 1000) : new Date();
  return doc;
}

async function tick(){
  try {
    const d = await fetchDoc();
    if (d) { lastDoc = d; render(d); }
    else { lastDoc = null; renderEmpty(`Ingen livescore med koden ${code} än. Kontrollera koden – sidan försöker igen av sig själv.`); }
  } catch (e) {
    if (lastDoc) $("meta").textContent = "Tappade kontakten – visar senaste ställningen och försöker igen.";
    else renderEmpty("Livescoren går inte att hämta just nu. Försöker igen …");
  }
}
function start(){
  clearInterval(timer);
  tick();
  timer = setInterval(() => { if (!document.hidden) tick(); }, 10000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && code) tick(); });

function setSrv(el, on){ el.classList.toggle("on", !!on); }

function renderEmpty(msg){
  $("badge").textContent = "Livescore"; $("badge").classList.add("off");
  $("me").textContent = "–"; $("op").textContent = "–"; $("meInit").textContent = "?"; $("opInit").textContent = "?";
  $("mePts").textContent = "0"; $("opPts").textContent = "0";
  $("games").innerHTML = ""; $("dots").innerHTML = ""; $("flow").innerHTML = "";
  $("matchesSec").classList.add("hidden"); $("updated").textContent = "";
  setSrv($("meSrv"), false); setSrv($("opSrv"), false);
  $("meta").textContent = msg;
}

function render(d){
  const player = d.player || "Spelaren";
  document.title = `${player} – livescore`;
  $("me").textContent = player;
  $("meInit").textContent = player.trim().charAt(0).toUpperCase() || "?";
  if (!d.matches || !d.matches.length) { renderEmpty("Ingen match har startat än."); $("me").textContent = player; return; }
  const m = d.matches.find(x => x.id === d.currentId) || d.matches[d.matches.length - 1];
  const to = m.to || 21, g = m.games[m.games.length - 1] || {me: 0, opp: 0};
  const setsMe = m.games.filter(x => gameDone(x, to) && x.me > x.opp).length;
  const setsOpp = m.games.filter(x => gameDone(x, to) && x.opp > x.me).length;
  const finished = setsMe >= 2 || setsOpp >= 2;
  const started = m.games.some(x => x.me || x.opp);
  $("op").textContent = m.opponent;
  $("opInit").textContent = (m.opponent || "?").trim().charAt(0).toUpperCase();
  $("mePts").textContent = g.me; $("opPts").textContent = g.opp;
  $("games").innerHTML = m.games.map((x, i) => `<span class="${i === m.games.length - 1 && !finished ? "cur" : ""}">Set ${i + 1}: ${x.me}–${x.opp}</span>`).join("");
  $("dots").innerHTML = finished ? "" : (d.recent || []).map(w => `<i class="${w ? "" : "l"}"></i>`).join("");
  const b = $("badge");
  if (finished) { b.textContent = (setsMe > setsOpp ? player : m.opponent) + " vann " + Math.max(setsMe, setsOpp) + "–" + Math.min(setsMe, setsOpp); b.classList.add("off"); }
  else if (started) { b.textContent = "Pågår · set " + m.games.length; b.classList.remove("off"); }
  else { b.textContent = "Nästa match"; b.classList.add("off"); }
  $("meta").textContent = m.round || "";
  const sv = (!finished && m.id === d.currentId) ? d.server : null;
  setSrv($("meSrv"), sv === "me"); setSrv($("opSrv"), sv === "opp");

  const sets = (d.sets || []);
  $("flow").innerHTML = sets.some(s => s && s.length)
    ? `<h2>Matchförlopp</h2><div class="legend"><span><i style="background:var(--win)"></i>${esc(player)} vann</span><span><i style="background:var(--own)"></i>${esc(player)} tappade</span></div>` +
      sets.map((q, i) => q && q.length ? flowSvg(q, i + 1, player, m.opponent) : "").join("")
    : "";

  $("matchesSec").classList.remove("hidden");
  $("list").innerHTML = d.matches.map(x => {
    const sc = x.games.filter(y => y.me || y.opp).map(y => y.me + "–" + y.opp).join(", ");
    const cur = x.id === m.id;
    return `<li><span>${cur ? "<b>" : ""}Mot ${esc(x.opponent)}${cur ? "</b>" : ""}${x.round ? `<br><small>${esc(x.round)}</small>` : ""}</span><span class="sc">${sc || "Ej spelad"}</span></li>`;
  }).join("");
  $("updated").textContent = "Uppdaterad " + fmtTime(d.updatedDate) + ". Sidan uppdateras av sig själv.";
}

function flowSvg(seq, n, player, opp){
  const W = 340, H = 130, pl = 26, pr = 10, pt = 10, pb = 10, plotH = H - pt - pb;
  let me = 0, op = 0; const pts = [{x: 0, d: 0}];
  seq.forEach((w, i) => { if (w) me++; else op++; pts.push({x: i + 1, d: me - op, w}); });
  const maxAbs = Math.max(3, ...pts.map(p => Math.abs(p.d))), N = Math.max(10, seq.length);
  const X = i => pl + (W - pl - pr) * i / N, Y = d => pt + plotH / 2 - d / maxAbs * plotH / 2;
  const path = pts.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.d).toFixed(1)).join(" ");
  const dots = pts.slice(1).map(p => `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.d).toFixed(1)}" r="3.6" fill="${p.w ? "var(--win)" : "var(--own)"}" stroke="var(--surface)" stroke-width="1.2"/>`).join("");
  return `<div class="flowset"><div class="flowhead"><b>Set ${n}</b><span>${me}–${op}</span></div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ledning poäng för poäng i set ${n}">
   <rect x="${pl}" y="${pt}" width="${W - pl - pr}" height="${plotH / 2}" fill="var(--win-soft)" opacity=".6"/>
   <text x="${pl + 4}" y="${pt + 11}" class="ax">${esc(player)} leder</text>
   <text x="${pl + 4}" y="${pt + plotH - 4}" class="ax">${esc(opp)} leder</text>
   <text x="${pl - 6}" y="${Y(maxAbs) + 4}" text-anchor="end" class="ax">+${maxAbs}</text>
   <text x="${pl - 6}" y="${Y(0) + 4}" text-anchor="end" class="ax">0</text>
   <text x="${pl - 6}" y="${Y(-maxAbs) + 4}" text-anchor="end" class="ax">−${maxAbs}</text>
   <line x1="${pl}" x2="${W - pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-dasharray="3 3"/>
   <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
   ${dots}
  </svg></div>`;
}

if (!CFG.token || !CFG.container) renderEmpty("Livescoren är inte konfigurerad än (CloudKit-token saknas).");
else if (!code) { renderEmpty(""); showJoin("Följ matchen live – skriv in koden."); }
else start();
</script>
</body>
</html>
